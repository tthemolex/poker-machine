# =============================================================================
#  Poker dealer: complete wiring harness (WireViz 0.4)
#  Render:  wireviz electronics/wiring.yml   (-> wiring.svg / wiring.png / wiring.html / wiring.bom.tsv)
#
#  Conventions (tools/check_pins.py relies on these):
#   * The ESP32 connector is named `ESP32`. Every GPIO pin is labelled `GPIO<n>`.
#   * Every cable that touches an ESP32 GPIO has `wirelabels`; the label of a wire
#     that lands on a GPIO is the firmware signal name (PIN_<label> in config.h).
#   * Pins are referenced by label in `connections` so the diagram reads like the schematic.
#
#  Rails: 12V = battery after the main rocker switch. 5V = Mini560 output.
#         3V3 = ESP32 on-board regulator (logic only: OLED, TMC VIO/MS, button/endstop GND bus).
#  All grounds are common (battery -, buck -, ESP32 GND, driver GND).
#  Location: base = static puck under the turret; turret = rotating part. Every base<->turret
#  wire is one conductor of the 20-way 1.27 mm ribbon clock spring in the bearing ID (D-19);
#  conductor allocation: docs/BUILD.md section 6 (turret moves 0..360 deg only).
# =============================================================================

metadata:
  title: Poker dealer wiring
  description: ESP32 + 2x TMC2209 + DRV8833 + Mini560, TalentCell 3S 6Ah battery

options:
  fontname: arial
  bgcolor: WH
  color_mode: SHORT

templates:
  - &sig
    gauge: 0.14 mm2
    show_equiv: false
  - &pwr
    gauge: 0.5 mm2
    show_equiv: false

connectors:
  # ---------------------------------------------------------------- power (base)
  BAT:
    type: TalentCell YB1206000-USB
    subtype: 3S Li-ion 11.1 V 6 Ah, 36 W max (base cradle)
    pinlabels: [OUT+, OUT-, IN+, IN-]
    notes: OUT = 5.5x2.1 DC output, IN = charger DC input. Own BMS + charger.
  JACK:
    type: Panel DC jack 5.5x2.1
    subtype: charge input on base wall
    pinlabels: [+, '-']
    notes: Plug the TalentCell 12.6 V charger here.
  SW:
    type: Mini rocker switch
    subtype: main power, base wall, SPST min. 3 A
    pinlabels: [IN, OUT]
  PWR12:
    type: 12 V distribution
    subtype: Wago 221 / solder bus, switched 12 V
    pinlabels: [+12V, GND]
  BUCK:
    type: Mini560 buck
    subtype: 12 V to 5.0 V, 3 A
    pinlabels: [IN+, IN-, OUT+, OUT-]
    notes: Set/verify 5.0 V before connecting loads.
  PWR5:
    type: 5 V distribution
    subtype: solder bus
    pinlabels: [+5V, GND]
  BUS3V3:
    type: 3.3 V logic distribution
    subtype: from ESP32 3V3 pin
    pinlabels: [3V3, GND]

  # ---------------------------------------------------------------- MCU (base)
  ESP32:
    type: ESP32 DevKit V1
    subtype: WROOM-32, 30-pin
    pinlabels: [GPIO25, GPIO26, GPIO27, GPIO14, GPIO13,
                GPIO32, GPIO33, GPIO19, GPIO23,
                GPIO15, GPIO4, GPIO16, GPIO17,
                GPIO18, GPIO5, GPIO2, GPIO34,
                GPIO21, GPIO22,
                VIN, GND, 3V3]
    notes: GPIO34 is input-only (no pull-up). GPIO2/5/15 are strapping pins; wiring keeps their boot levels safe.

  # ---------------------------------------------------------------- drivers (base)
  TMC_TURN:
    type: TMC2209 StepStick
    subtype: turret driver, 16 usteps (MS1=MS2=VIO)
    pinlabels: [EN, MS1, MS2, STEP, DIR, VIO, GND, VM, PGND, A1, A2, B1, B2]
    notes: VREF ~1.13 V for 0.8 A RMS (module with 0.11 R sense). PDN/UART left open.
    additional_components:
      - type: Electrolytic capacitor 100 uF 25 V
        subtype: across VM / PGND, at the driver pins
        qty: 1
      - type: Resistor 10 k
        subtype: EN to VIO (3V3) pull-up for the shared EN line, keeps both drivers off during ESP32 reset / flashing
        qty: 1
  TMC_RACK:
    type: TMC2209 StepStick
    subtype: rack driver, 8 usteps (MS1=MS2=GND)
    pinlabels: [EN, MS1, MS2, STEP, DIR, VIO, GND, VM, PGND, A1, A2, B1, B2]
    notes: VREF ~1.13 V for 0.8 A RMS (module with 0.11 R sense). PDN/UART left open.
    additional_components:
      - type: Electrolytic capacitor 100 uF 25 V
        subtype: across VM / PGND, at the driver pins
        qty: 1
  DRV:
    type: DRV8833 module
    subtype: VM = 5 V (max 10.8 V!)
    pinlabels: [AIN1, AIN2, BIN1, BIN2, VM, GND, AOUT1, AOUT2, BOUT1, BOUT2, nSLEEP]
    notes: Ch A = loader N20 (IN1/IN2). Ch B = launcher, BIN1 = IN3 (PWM), BIN2 = IN4 tied to GND.

  # ---------------------------------------------------------------- motors
  M_TURN:
    type: NEMA17 pancake stepper
    subtype: turret drive, base, GT2 20T pulley
    pinlabels: [A+, A-, B+, B-]
  M_RACK:
    type: NEMA17 + integrated T8x8 leadscrew
    subtype: rack lift, turret
    pinlabels: [A+, A-, B+, B-]
  N20:
    type: N20 gear motor ~100 rpm
    subtype: loader feed roller, turret
    pinlabels: [M+, M-]
    additional_components:
      - type: Ceramic capacitor 100 nF
        subtype: across motor terminals (EMI)
        qty: 1
  M130:
    type: 130-size DC motor
    subtype: launcher wheel, turret
    pinlabels: [M+, M-]
    additional_components:
      - type: Ceramic capacitor 100 nF
        subtype: across motor terminals (EMI)
        qty: 1
  SERVO:
    type: MG90S servo
    subtype: pusher, turret
    pinlabels: [GND, V+, SIG]
    pincolors: [BN, RD, OG]

  # ---------------------------------------------------------------- sensors / UI
  IRRX_LOAD:
    type: IR break-beam receiver
    subtype: loader, turret (open collector, VCC 5 V)
    pinlabels: [VCC, GND, OUT]
    pincolors: [RD, BK, WH]
  IRTX_LOAD:
    type: IR break-beam emitter
    subtype: loader, turret
    pinlabels: [VCC, GND]
    pincolors: [RD, BK]
  IRRX_EXIT:
    type: IR break-beam receiver
    subtype: launcher entry, turret (open collector, VCC 5 V)
    pinlabels: [VCC, GND, OUT]
    pincolors: [RD, BK, WH]
  IRTX_EXIT:
    type: IR break-beam emitter
    subtype: launcher entry, turret
    pinlabels: [VCC, GND]
    pincolors: [RD, BK]
  HALL:
    type: A3144 hall switch
    subtype: turret home, base deck (magnet in turntable at 0 deg)
    pinlabels: [VCC, GND, OUT]
    notes: Needs 4.5 V min, so VCC = 5 V. Open-collector OUT, pulled up to 3V3 only.
    additional_components:
      - type: Resistor 10 k
        subtype: OUT to 3V3 pull-up (stronger than the internal one)
        qty: 1
  ENDSTOP:
    type: Microswitch
    subtype: rack bottom, turret
    pinlabels: [COM, 'NO', 'NC']
  BTN_GO:
    type: 12 mm momentary button
    subtype: GO, base wall
    pinlabels: ['1', '2']
  BTN_SET:
    type: 12 mm momentary button
    subtype: SET, base wall
    pinlabels: ['1', '2']
  LED:
    type: 5 mm LED
    subtype: status, base wall
    pinlabels: [A, K]
  DIV:
    type: Battery sense divider
    subtype: 100k (top) / 22k (bottom) + 100 nF
    pinlabels: [TOP, MID, BOT]
    notes: TOP = switched +12V, MID = ADC node, BOT = GND. 12.6 V to 2.27 V at GPIO34.
    additional_components:
      - type: Resistor 100 k 1%
        subtype: TOP to MID
        qty: 1
      - type: Resistor 22 k 1%
        subtype: MID to BOT
        qty: 1
      - type: Ceramic capacitor 100 nF
        subtype: MID to BOT (ADC filter)
        qty: 1
  OLED:
    type: SSD1306 0.96 in OLED
    subtype: 128x64 I2C 0x3C, 3.3 V, base wall (optional)
    pinlabels: [GND, VCC, SCL, SDA]

cables:
  # ------------------------------------------------------------- power
  W_CHG:
    <<: *pwr
    wirecount: 2
    colors: [RD, BK]
    length: 0.15
    notes: ends in a 5.5x2.1 plug into the battery DC input
  W_BAT:
    <<: *pwr
    wirecount: 2
    colors: [RD, BK]
    length: 0.15
    notes: from the battery 5.5x2.1 output plug
  W_SW:
    <<: *pwr
    wirecount: 1
    colors: [RD]
    length: 0.1
  W_BUCKIN:
    <<: *pwr
    wirecount: 2
    colors: [RD, BK]
    length: 0.08
  W_BUCKOUT:
    <<: *pwr
    wirecount: 2
    colors: [OG, BK]
    length: 0.08
  W_VIN:
    <<: *pwr
    wirecount: 2
    colors: [OG, BK]
    length: 0.1
  W_3V3:
    <<: *sig
    wirecount: 2
    colors: [YE, BK]
    length: 0.05
  W_VM_TURN:
    <<: *pwr
    wirecount: 2
    colors: [RD, BK]
    length: 0.1
  W_VM_RACK:
    <<: *pwr
    wirecount: 2
    colors: [RD, BK]
    length: 0.1
  W_DRV_PWR:
    <<: *sig
    wirecount: 4
    colors: [OG, BK, BK, OG]
    wirelabels: [5V, GND, IN4_GND, nSLEEP_5V]
    length: 0.08

  # ------------------------------------------------------------- stepper drivers
  W_TURN:
    <<: *sig
    wirecount: 3
    colors: [YE, GN, VT]
    wirelabels: [TURN_STEP, TURN_DIR, STEP_EN]
    length: 0.1
  W_RACK:
    <<: *sig
    wirecount: 3
    colors: [YE, GN, VT]
    wirelabels: [RACK_STEP, RACK_DIR, STEP_EN]
    length: 0.1
  W_TURN_LOGIC:
    <<: *sig
    wirecount: 4
    colors: [YE, BK, YE, YE]
    wirelabels: [VIO, GND, MS1_HI, MS2_HI]
    length: 0.1
  W_RACK_LOGIC:
    <<: *sig
    wirecount: 4
    colors: [YE, BK, BK, BK]
    wirelabels: [VIO, GND, MS1_LO, MS2_LO]
    length: 0.1
  W_COIL_TURN:
    gauge: 0.25 mm2
    show_equiv: false
    wirecount: 4
    colors: [BK, GN, RD, BU]
    length: 0.15
    notes: check coil pairs with a meter; swap one pair to reverse direction
  W_COIL_RACK:
    gauge: 0.25 mm2
    show_equiv: false
    wirecount: 4
    colors: [BK, GN, RD, BU]
    length: 0.35
    notes: turret, via the ribbon clock spring (D-19)

  # ------------------------------------------------------------- DC motors + servo
  W_DRV:
    <<: *sig
    wirecount: 3
    colors: [WH, GY, BU]
    wirelabels: [FEED_IN1, FEED_IN2, LAUNCH]
    length: 0.08
  W_N20:
    gauge: 0.25 mm2
    show_equiv: false
    wirecount: 2
    colors: [RD, BK]
    length: 0.35
    notes: turret, via the ribbon clock spring (D-19)
  W_130:
    gauge: 0.25 mm2
    show_equiv: false
    wirecount: 2
    colors: [RD, BK]
    length: 0.35
    notes: turret, via the ribbon clock spring (D-19)
  W_SERVO:
    <<: *sig
    wirecount: 3
    colors: [OG, RD, BN]
    wirelabels: [PUSHER, 5V, GND]
    length: 0.35
    notes: turret, via the ribbon clock spring (D-19)

  # ------------------------------------------------------------- sensors
  W_IR_LOAD:
    <<: *sig
    wirecount: 3
    colors: [WH, RD, BK]
    wirelabels: [IR_LOAD, 5V, GND]
    length: 0.35
  W_IRTX_LOAD:
    <<: *sig
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [5V, GND]
    length: 0.35
  W_IR_EXIT:
    <<: *sig
    wirecount: 3
    colors: [WH, RD, BK]
    wirelabels: [IR_EXIT, 5V, GND]
    length: 0.35
  W_IRTX_EXIT:
    <<: *sig
    wirecount: 2
    colors: [RD, BK]
    wirelabels: [5V, GND]
    length: 0.35
  W_HALL:
    <<: *sig
    wirecount: 3
    colors: [WH, RD, BK]
    wirelabels: [HOME_TURN, 5V, GND]
    length: 0.1
  W_ENDSTOP:
    <<: *sig
    wirecount: 2
    colors: [WH, BK]
    wirelabels: [HOME_RACK, GND]
    length: 0.35

  # ------------------------------------------------------------- UI
  W_BTN_GO:
    <<: *sig
    wirecount: 2
    colors: [WH, BK]
    wirelabels: [BTN_GO, GND]
    length: 0.1
  W_BTN_SET:
    <<: *sig
    wirecount: 2
    colors: [WH, BK]
    wirelabels: [BTN_SET, GND]
    length: 0.1
  W_LED:
    <<: *sig
    wirecount: 2
    colors: [GN, BK]
    wirelabels: [LED, GND]
    length: 0.1
    additional_components:
      - type: Resistor 330 R
        subtype: in series with the LED anode wire
        qty: 1
  W_VBAT:
    <<: *sig
    wirecount: 3
    colors: [PK, RD, BK]
    wirelabels: [VBAT, 12V_SW, GND]
    length: 0.1
  W_OLED:
    <<: *sig
    wirecount: 4
    colors: [BU, GN, YE, BK]
    wirelabels: [OLED_SDA, OLED_SCL, 3V3, GND]
    length: 0.12

connections:
  # ---- power path: battery -> switch -> 12V bus -> buck -> 5V bus -> ESP32 -> 3V3 bus
  - - JACK: [+, '-']
    - W_CHG: [1-2]
    - BAT: [IN+, IN-]
  - - BAT: [OUT+]
    - W_BAT: [1]
    - SW: [IN]
  - - BAT: [OUT-]
    - W_BAT: [2]
    - PWR12: [GND]
  - - SW: [OUT]
    - W_SW: [1]
    - PWR12: [+12V]
  - - PWR12: [+12V, GND]
    - W_BUCKIN: [1-2]
    - BUCK: [IN+, IN-]
  - - BUCK: [OUT+, OUT-]
    - W_BUCKOUT: [1-2]
    - PWR5: [+5V, GND]
  - - PWR5: [+5V, GND]
    - W_VIN: [1-2]
    - ESP32: [VIN, GND]
  - - ESP32: [3V3, GND]
    - W_3V3: [1-2]
    - BUS3V3: [3V3, GND]

  # ---- stepper drivers
  - - ESP32: [GPIO25, GPIO26, GPIO13]
    - W_TURN: [1-3]
    - TMC_TURN: [STEP, DIR, EN]
  - - ESP32: [GPIO27, GPIO14, GPIO13]
    - W_RACK: [1-3]
    - TMC_RACK: [STEP, DIR, EN]
  - - BUS3V3: [3V3, GND, 3V3, 3V3]
    - W_TURN_LOGIC: [1-4]
    - TMC_TURN: [VIO, GND, MS1, MS2]
  - - BUS3V3: [3V3, GND, GND, GND]
    - W_RACK_LOGIC: [1-4]
    - TMC_RACK: [VIO, GND, MS1, MS2]
  - - PWR12: [+12V, GND]
    - W_VM_TURN: [1-2]
    - TMC_TURN: [VM, PGND]
  - - PWR12: [+12V, GND]
    - W_VM_RACK: [1-2]
    - TMC_RACK: [VM, PGND]
  - - TMC_TURN: [A1, A2, B1, B2]
    - W_COIL_TURN: [1-4]
    - M_TURN: [A+, A-, B+, B-]
  - - TMC_RACK: [A1, A2, B1, B2]
    - W_COIL_RACK: [1-4]
    - M_RACK: [A+, A-, B+, B-]

  # ---- DRV8833 + DC motors
  - - ESP32: [GPIO32, GPIO33, GPIO19]
    - W_DRV: [1-3]
    - DRV: [AIN1, AIN2, BIN1]
  - - PWR5: [+5V, GND, GND, +5V]
    - W_DRV_PWR: [1-4]
    - DRV: [VM, GND, BIN2, nSLEEP]
  - - DRV: [AOUT1, AOUT2]
    - W_N20: [1-2]
    - N20: [M+, M-]
  - - DRV: [BOUT1, BOUT2]
    - W_130: [1-2]
    - M130: [M+, M-]

  # ---- pusher servo
  - - ESP32: [GPIO23]
    - W_SERVO: [1]
    - SERVO: [SIG]
  - - PWR5: [+5V, GND]
    - W_SERVO: [2-3]
    - SERVO: [V+, GND]

  # ---- IR break-beams (all on 5V; receiver OUT is open-collector, pulled up to 3.3 V by the ESP32 only)
  - - ESP32: [GPIO15]
    - W_IR_LOAD: [1]
    - IRRX_LOAD: [OUT]
  - - PWR5: [+5V, GND]
    - W_IR_LOAD: [2-3]
    - IRRX_LOAD: [VCC, GND]
  - - PWR5: [+5V, GND]
    - W_IRTX_LOAD: [1-2]
    - IRTX_LOAD: [VCC, GND]
  - - ESP32: [GPIO4]
    - W_IR_EXIT: [1]
    - IRRX_EXIT: [OUT]
  - - PWR5: [+5V, GND]
    - W_IR_EXIT: [2-3]
    - IRRX_EXIT: [VCC, GND]
  - - PWR5: [+5V, GND]
    - W_IRTX_EXIT: [1-2]
    - IRTX_EXIT: [VCC, GND]

  # ---- homing
  - - ESP32: [GPIO16]
    - W_HALL: [1]
    - HALL: [OUT]
  - - PWR5: [+5V, GND]
    - W_HALL: [2-3]
    - HALL: [VCC, GND]
  - - ESP32: [GPIO17]
    - W_ENDSTOP: [1]
    - ENDSTOP: ['NO']
  - - BUS3V3: [GND]
    - W_ENDSTOP: [2]
    - ENDSTOP: [COM]

  # ---- UI
  - - ESP32: [GPIO18]
    - W_BTN_GO: [1]
    - BTN_GO: ['1']
  - - BUS3V3: [GND]
    - W_BTN_GO: [2]
    - BTN_GO: ['2']
  - - ESP32: [GPIO5]
    - W_BTN_SET: [1]
    - BTN_SET: ['1']
  - - BUS3V3: [GND]
    - W_BTN_SET: [2]
    - BTN_SET: ['2']
  - - ESP32: [GPIO2]
    - W_LED: [1]
    - LED: [A]
  - - BUS3V3: [GND]
    - W_LED: [2]
    - LED: [K]

  # ---- battery sense (switched 12 V -> 100k -> MID -> 22k -> GND)
  - - ESP32: [GPIO34]
    - W_VBAT: [1]
    - DIV: [MID]
  - - PWR12: [+12V, GND]
    - W_VBAT: [2-3]
    - DIV: [TOP, BOT]

  # ---- OLED (optional)
  - - ESP32: [GPIO21, GPIO22]
    - W_OLED: [1-2]
    - OLED: [SDA, SCL]
  - - BUS3V3: [3V3, GND]
    - W_OLED: [3-4]
    - OLED: [VCC, GND]
