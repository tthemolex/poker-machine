; Poker dealer firmware (ESP32 DevKit V1 / WROOM-32)
;
;   pio run  -e esp32dev            build firmware
;   pio run  -e esp32dev -t upload  flash
;   pio test -e native              run the host unit tests (game logic, rack, RNG, ...)
;
; Hardware-independent logic lives in lib/dealer_core and is compiled for both
; targets. src/ is the ESP32 hardware layer only.

[platformio]
default_envs = esp32dev

[common]
; -Werror on project code only (src/, lib/dealer_core); third-party libraries keep their own flags.
; Note: the ESP32 Arduino core adds -Wno-error=unused-*, so also grep the log for "warning:".
project_flags = -Wall -Wextra -Werror
; include/ (config.h, geometry.h) is shared with lib/dealer_core

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^3.0.6
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
build_src_flags = ${common.project_flags} -DHAS_OLED=1
build_flags = -Iinclude

; Same firmware without the SSD1306 code (checks the HAS_OLED=0 build).
[env:esp32dev_nooled]
extends = env:esp32dev
build_src_flags = ${common.project_flags} -DHAS_OLED=0

[env:native]
platform = native
test_framework = unity
build_flags = -Iinclude ${common.project_flags} -std=c++17
; tests only exercise lib/dealer_core (pure logic), never src/
test_build_src = no
lib_compat_mode = off
